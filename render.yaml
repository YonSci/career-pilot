# Render Blueprint: one always-on web service with a persistent disk.
# The API, dashboard, in-process scheduler and Telegram poller run in this
# single instance; SQLite lives on the disk. Scale to Postgres + worker later.
services:
  - type: web
    name: jobs-find-ai
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    plan: starter            # free instances sleep, which stops scheduled searches
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: career-data
      mountPath: /app/data
      sizeGB: 2
    envVars:
      - key: DATABASE_URL
        value: sqlite:////app/data/career.db
      - key: DATA_DIR
        value: /app/data
      - key: TASK_QUEUE
        value: background
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: INVITE_ONLY
        value: "true"
      - key: SPONSORED_SEATS
        value: "20"          # first N members use OPENAI_API_KEY with the sponsored plan's caps
      - key: SERVER_KEY_MONTHLY_CALLS
        value: "4000"        # hard cap on model calls charged to OPENAI_API_KEY per month (owner + sponsored)
      - key: AI_ACTIONS_PER_HOUR
        value: "40"          # per-account limit on manual AI actions
      # --- Income. Prices are in whole units; defaults live in config.py.
      # - key: PRICE_PRO_ETB          # 350   - key: PRICE_PRO_USD        # 9
      # - key: PRICE_PRO_PLUS_ETB     # 800   - key: PRICE_PRO_PLUS_USD   # 19
      # - key: PRICE_PACKAGE_ETB      # 100   - key: PRICE_PACKAGE_USD    # 2
      # - key: FEATURED_LISTING_ETB   # 2500  - key: INSTITUTION_SEAT_ETB # 200
      - key: BILLING_CONTACT
        sync: false          # shown to members paying by hand: "Telebirr 09xx xxx xxx (Name)" or bank details
      - key: CHAPA_SECRET_KEY
        sync: false          # Chapa dashboard > Settings > API keys (ETB checkout). Leave unset for manual payments.
      - key: CHAPA_WEBHOOK_SECRET
        sync: false          # Chapa dashboard > Settings > Webhooks: URL https://<host>/api/billing/webhook/chapa, secret hash
      - key: LEMON_CHECKOUT_PRO
        sync: false          # Lemon Squeezy hosted checkout links for cards (USD); webhook URL /api/billing/webhook/lemonsqueezy
      - key: LEMON_CHECKOUT_PRO_PLUS
        sync: false
      - key: LEMON_CHECKOUT_PACKAGE
        sync: false
      - key: LEMON_WEBHOOK_SECRET
        sync: false
      # --- Promotion. Public Telegram channel the bot posts to; the bot must be an administrator of it.
      - key: TELEGRAM_CHANNEL_ID
        sync: false          # e.g. @jobsfindai
      - key: VAPID_PUBLIC_KEY
        sync: false          # web push (installable app): python deployment/vapid_keys.py prints the pair
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false          # mailto:you@example.org
      - key: GOOGLE_SITE_VERIFICATION
        sync: false          # content value of Search Console's google-site-verification meta tag
      - key: TELEGRAM_CHANNEL_DAILY_HOUR
        value: "7"           # UTC hour of the daily post; the weekly digest goes out on Mondays
      - key: APP_NAME
        value: Jobs Find AI
      - key: PUBLIC_URL
        sync: false          # https://<service>.onrender.com or your custom domain
      - key: CORS_ORIGINS
        sync: false          # same value as PUBLIC_URL
      - key: APP_TOKEN
        generateValue: true
      - key: SECRET_KEY
        generateValue: true  # encrypts users' stored API keys and mailbox passwords; never rotate casually
      - key: OPENAI_API_KEY
        sync: false          # owner account only; members bring their own keys
      - key: EXTRACT_MODEL
        value: gpt-5.6-luna
      - key: MATCH_MODEL
        value: gpt-5.6-terra
      - key: WRITE_MODEL
        value: gpt-5.6-sol
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: RELIEFWEB_APPNAME
        sync: false
      - key: POSTHOG_KEY
        sync: false          # PostHog project API key (public); empty disables analytics and replay
      - key: POSTHOG_HOST
        value: https://eu.i.posthog.com
      - key: POSTHOG_REPLAY
        value: "true"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
